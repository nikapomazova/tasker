<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tasker Guy</title>
    <style>
      :root {
        --face-parts-size: 0.7;

        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        overflow: hidden;
        background: #e9e9e9;
        color: #202020;
      }

      .toolbar {
        position: relative;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 92px;
        padding: 18px;
        background: rgba(233, 233, 233, 0.9);
        border-bottom: 1px solid #cecece;
        backdrop-filter: blur(8px);
      }

      #create-character {
        padding: 13px 22px;
        border: 2px solid #202020;
        border-radius: 999px;
        background: #fff;
        color: #202020;
        font: inherit;
        font-weight: 750;
        cursor: pointer;
        box-shadow: 0 4px 0 #202020;
        transition: transform 120ms ease, box-shadow 120ms ease;
      }

      #create-character:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 0 #202020;
      }

      #create-character:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 #202020;
      }

      #playground {
        position: fixed;
        inset: 92px 0 0;
        overflow: hidden;
      }

      .character {
        --limb-angle: 8deg;
        --limb-duration: 620ms;
        position: absolute;
        display: none;
        width: clamp(180px, 25vw, 310px);
        aspect-ratio: 1;
        will-change: transform;
      }

      .character.is-visible {
        display: block;
      }

      .part {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        pointer-events: none;
        user-select: none;
      }

      .limb {
        inset: auto;
        z-index: 1;
        transition: transform 380ms ease-out;
      }

      .arm {
        top: 19%;
        width: 62%;
        height: 62%;
        z-index: 2;
        transform-origin: 50% 51%;
        animation-duration: var(--limb-duration);
      }

      .leg {
        bottom: 5%;
        width: 33%;
        height: 33%;
        transform-origin: 50% 58%;
        animation-duration: var(--limb-duration);
      }

      .left-arm { left: -8%; }
      .right-arm { right: -8%; }
      .left-leg { left: 20%; }
      .right-leg { right: 20%; }

      .left-arm, .left-leg {
        animation-name: left-limb-wiggle;
        animation-timing-function: ease-in-out;
        animation-iteration-count: infinite;
        animation-direction: alternate;
      }

      .right-arm, .right-leg {
        animation-name: right-limb-wiggle;
        animation-timing-function: ease-in-out;
        animation-iteration-count: infinite;
        animation-direction: alternate;
      }

      .left-arm, .right-arm { animation-direction: alternate-reverse; }

      .character.is-walking {
        --limb-angle: 8deg;
        --limb-duration: 620ms;
      }

      .character.is-running {
        --limb-angle: 17deg;
        --limb-duration: 270ms;
      }

      .character.is-jumping {
        --limb-angle: 13deg;
        --limb-duration: 360ms;
      }

      .character.is-stopped .limb {
        animation: none;
      }

      .character.is-stopped .left-leg {
        transform: rotate(0deg);
      }

      .character.is-stopped .right-leg {
        transform: scaleX(-1);
      }

      .character.is-stopped .left-arm {
        transform: rotate(14deg);
      }

      .character.is-stopped .right-arm {
        transform: scaleX(-1) rotate(14deg);
      }

      .body {
        z-index: 3;
        transform: scale(0.65);
      }
      .eyes {
        z-index: 4;
        transform: scale(var(--face-parts-size));
    }
      .accessory {
        z-index: 5;
        transform: scale(var(--face-parts-size));
    }

      @keyframes left-limb-wiggle {
        from { transform: rotate(calc(var(--limb-angle) * -1)) translateY(-1px); }
        to { transform: rotate(var(--limb-angle)) translateY(2px); }
      }

      @keyframes right-limb-wiggle {
        from { transform: scaleX(-1) rotate(calc(var(--limb-angle) * -1)) translateY(-1px); }
        to { transform: scaleX(-1) rotate(var(--limb-angle)) translateY(2px); }
      }

      @media (prefers-reduced-motion: reduce) {
        .limb { animation: none; }
        .right-arm, .right-leg { transform: scaleX(-1); }
      }
    </style>
  </head>
  <body>
    <header class="toolbar">
      <button id="create-character" type="button">Make a random character</button>
    </header>

    <main id="playground" aria-label="Character playground">
      <template id="character-template">
        <div class="character" aria-label="A randomly assembled moving character">
          <img class="part limb leg left-leg" alt="" />
          <img class="part limb leg right-leg" alt="" />
          <img class="part limb arm left-arm" alt="" />
          <img class="part limb arm right-arm" alt="" />
          <img class="part body" alt="" />
          <img class="part eyes" alt="" />
          <img class="part accessory" alt="" />
        </div>
      </template>
    </main>

    <script src="tasker_guy.js"></script>
  </body>
</html>
